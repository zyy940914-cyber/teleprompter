name: Teleprompter
options:
  bundleIdPrefix: com.teleprompter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Teleprompter:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teleprompter.app
        PRODUCT_NAME: Teleprompter
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 悬浮提词器
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: 需要使用麦克风实现"你说话、字幕就跟着滚动"的AI跟读功能。声音只在本机分析，不会上传或保存。
        NSSpeechRecognitionUsageDescription: 需要使用语音识别，把你说的话和稿子实时对齐，实现"读到哪、字幕走到哪"。识别优先在手机本地完成。
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false

schemes:
  Teleprompter:
    build:
      targets:
        Teleprompter: all
    run:
      config: Debug
    archive:
      config: Release
