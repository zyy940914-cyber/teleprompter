name: Build IPA

# 在 GitHub 的免费服务器上编译出 iOS 安装包（不需要你有 Xcode）
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project Teleprompter.xcodeproj \
            -scheme Teleprompter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包成 .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Teleprompter.app Payload/
          zip -r Teleprompter.ipa Payload
          ls -lh Teleprompter.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-ipa
          path: Teleprompter.ipa
