workflows:
  ios-unsigned:
    name: 编译悬浮提词器
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: Teleprompter
    scripts:
      - name: 生成工程并编译
        script: |
          set -e
          set -o pipefail
          echo "PWD=$(pwd)"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate
          ls -d *.xcodeproj
          echo "--- xcodebuild 开始 ---"
          xcodebuild \
            -project Teleprompter.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "--- 编译成功 ---"
      - name: 打包成 ipa
        script: |
          set -e
          mkdir -p Payload
          APP=$(find build -name "Teleprompter.app" -type d | head -1)
          echo "找到 app: $APP"
          if [ -z "$APP" ]; then
            echo "❌ 没有产出 .app"
            tail -80 build.log || true
            exit 1
          fi
          if [ ! -f "$APP/Teleprompter" ]; then
            echo "❌ .app 里没有可执行文件（编译其实失败了）"
            tail -80 build.log || true
            exit 1
          fi
          cp -R "$APP" Payload/
          rm -f Teleprompter.ipa
          zip -qry Teleprompter.ipa Payload
          echo "--- 校验 ipa ---"
          unzip -l Teleprompter.ipa
          if ! unzip -l Teleprompter.ipa | grep -q "Payload/Teleprompter.app/Teleprompter"; then
            echo "❌ ipa 里没有可执行文件，作废"
            exit 1
          fi
          ls -lh Teleprompter.ipa
    artifacts:
      - Teleprompter.ipa
      - build.log
      - build/Build/Products/Release-iphoneos/*.app
