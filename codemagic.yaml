workflows:
  ios-unsigned:
    name: 编译悬浮提词器
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: Teleprompter
    scripts:
      - name: 安装 XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: 生成 Xcode 工程
        script: |
          xcodegen generate
          ls -d *.xcodeproj
      - name: 编译（不签名）
        script: |
          xcodebuild \
            -project Teleprompter.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 打包成 ipa
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Teleprompter.app Payload/
          zip -r Teleprompter.ipa Payload
          ls -lh Teleprompter.ipa
    artifacts:
      - Teleprompter.ipa
      - build/Build/Products/Release-iphoneos/*.app
