workflows:
  ios-unsigned:
    name: 编译悬浮提词器
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: Teleprompter
    scripts:
      - name: 生成工程并编译
        script: |
          set +e
          echo "PWD=$(pwd)"
          ls -la
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate 2>&1 | tee -a build.log
          echo "--- 生成后的目录 ---" | tee -a build.log
          ls -d *.xcodeproj 2>&1 | tee -a build.log
          echo "--- xcodebuild 开始 ---" | tee -a build.log
          xcodebuild \
            -project Teleprompter.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build.log
          echo "--- 关键报错 ---"
          grep -E "error:|does not exist|BUILD FAILED" build.log | head -80
      - name: 打包成 ipa
        script: |
          set +e
          pwd
          mkdir -p Payload
          APP=$(find . -name "Teleprompter.app" -path "*Release-iphoneos*" -maxdepth 6 | head -1)
          echo "找到 app: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            cp -R "$APP" Payload/
            zip -r Teleprompter.ipa Payload
            ls -lh Teleprompter.ipa
          else
            echo "❌ 编译没有产出 .app，查看 build.log"
            exit 1
          fi
    artifacts:
      - Teleprompter.ipa
      - build.log
      - build/Build/Products/Release-iphoneos/*.app
