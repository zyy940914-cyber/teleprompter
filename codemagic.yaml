workflows:
  ios-unsigned:
    name: 编译悬浮提词器
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: Teleprompter
    scripts:
      - name: 安装 XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: 生成 Xcode 工程
        script: |
          xcodegen generate
          ls -d *.xcodeproj
          xcodebuild -list -project Teleprompter.xcodeproj || true
      - name: 编译（不签名）
        script: |
          set +e
          xcodebuild \
            -project Teleprompter.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "===xcodebuild 结束，退出码见上==="
          grep -E "error:|warning: .*deprecated" build.log | head -60 || true
      - name: 打包成 ipa
        script: |
          set +e
          mkdir -p Payload
          APP="build/Build/Products/Release-iphoneos/Teleprompter.app"
          if [ -d "$APP" ]; then
            cp -R "$APP" Payload/
            zip -r Teleprompter.ipa Payload
            ls -lh Teleprompter.ipa
          else
            echo "没有生成 .app，跳过打包"
          fi
    artifacts:
      - Teleprompter.ipa
      - build.log
      - build/Build/Products/Release-iphoneos/*.app
